<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LLM Beachrot Leaderboard · 大模型 Beachrot 排行榜</title>
<meta name="description" content="The Beachrot Index: an independent evaluation of 16 frontier LLMs from 7 labs across versioning, nomenclature, corporate structure and pricing efficiency. An original benchmark by @史诗级猫头嘤 on Bilibili.">
<meta name="theme-color" content="#ffffff">
<style>
:root{
  --bg:#ffffff;--ink:#141413;--ink2:#5e5d59;--ink3:#8f8d86;--line:#e8e6df;--grid:#f0eee9;--ivory:#faf9f5;--accent:#d97757;
  --serif:"Tiempos Headline","Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Songti SC","Noto Serif CJK SC","Source Han Serif SC","STSong",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 32px}
@media (max-width:640px){.wrap{padding:0 16px}}

/* nav */
.nav{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;gap:24px;height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--serif);font-size:20px;letter-spacing:-.01em;white-space:nowrap}
.brand svg{flex:none}
.links{display:flex;gap:22px;flex:1;min-width:0;overflow:hidden}
.links a{font-size:13.5px;color:var(--ink2);text-decoration:none;white-space:nowrap}
.links a:hover{color:var(--ink)}
.nav-r{display:flex;gap:8px;margin-left:auto;align-items:center}
.btn-ghost,.btn-pri{height:34px;border-radius:8px;padding:0 12px;font-size:13px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn-ghost{border:1px solid var(--line);background:#fff}
.btn-ghost:hover{border-color:#cfccc3}
.btn-pri{border:1px solid var(--ink);background:var(--ink);color:#fff}
.btn-pri:hover{background:#2c2c2a}
@media (max-width:900px){.links{display:none}}

/* hero */
.hero{padding:72px 0 40px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(40px,7.2vw,78px);line-height:1.04;letter-spacing:-.02em;margin:14px 0 18px}
.lede{font-size:clamp(16px,1.9vw,19px);color:var(--ink2);max-width:760px;margin:0 0 18px;line-height:1.55}
.byline{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:13.5px;color:var(--ink2);align-items:center}
.sig{color:var(--ink);font-weight:600}
.byline .dot{color:var(--ink3)}
@media (max-width:640px){.byline .dot{display:none}.byline{flex-direction:column;align-items:flex-start;gap:2px}}
h1 .w{display:inline-block;white-space:nowrap}
.hero-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,8fr);gap:20px;margin-top:40px;align-items:stretch}
@media (max-width:960px){.hero-grid{grid-template-columns:1fr}}

.card{border:1px solid var(--line);border-radius:14px;background:#fff;padding:24px}
@media (max-width:640px){.card{padding:18px 16px;border-radius:12px}.card-h{flex-wrap:wrap;gap:10px}}
.card-h{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:14px}
.card-h h3{font-family:var(--serif);font-weight:400;font-size:21px;line-height:1.25;margin:0;letter-spacing:-.005em}
.card-h p{margin:4px 0 0;font-size:13px;color:var(--ink2);line-height:1.5}
.hib{flex:none;font-size:11.5px;color:var(--ink3);border:1px solid var(--line);border-radius:999px;padding:3px 9px;white-space:nowrap}
.chart{position:relative;width:100%;min-height:120px}
.chart svg{display:block;width:100%;height:auto;overflow:visible;font-family:var(--sans)}

/* champion */
.champ{display:flex;flex-direction:column;gap:14px;background:var(--ivory)}
.champ .lab{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.champ .who{display:flex;align-items:center;gap:14px}
.champ .who .lg{width:52px;height:52px}
.champ .nm{font-family:var(--serif);font-size:clamp(26px,3.2vw,34px);line-height:1.1;letter-spacing:-.01em}
.champ .meta{font-size:12.5px;color:var(--ink2);margin-top:4px}
.champ .score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.champ .score b{font-size:clamp(64px,8vw,92px);line-height:.9;font-weight:600;letter-spacing:-.03em}
.champ .score span{color:var(--ink3);font-size:15px}
.sotf{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:#fff;border-radius:999px;font-size:12px;padding:4px 11px 4px 9px;font-weight:500;letter-spacing:.01em;white-space:nowrap}
.sotf i{width:6px;height:6px;border-radius:50%;background:var(--accent);display:block}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin:2px 0 0;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.facts dt{font-size:11.5px;color:var(--ink3)}
.facts dd{margin:1px 0 0;font-size:14px;font-variant-numeric:tabular-nums}
.comp{display:grid;grid-template-columns:auto 1fr auto;gap:7px 12px;align-items:center;font-size:12.5px;margin-top:auto;padding-top:6px}
.comp .k{color:var(--ink2);white-space:nowrap}
.comp .tr{height:6px;border-radius:3px;background:#ebe8e0;overflow:hidden}
.comp .tr i{display:block;height:100%;border-radius:3px;background:var(--ink);transform-origin:0 50%}
.comp .v{font-variant-numeric:tabular-nums;color:var(--ink);text-align:right;min-width:2ch}

.lg{display:inline-block;width:18px;height:18px;background:center/contain no-repeat;flex:none;vertical-align:middle}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-top:20px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tile{padding:18px 20px;border-right:1px solid var(--line)}
.tile:last-child{border-right:0}
.tile .k{font-size:12.5px;color:var(--ink2)}
.tile .v{font-size:30px;font-weight:600;letter-spacing:-.02em;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.tile .w{font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:6px;min-width:0}
.tile .w span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:860px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tile:nth-child(2){border-right:0}.tile:nth-child(-n+2){border-bottom:1px solid var(--line)}}
@media (max-width:640px){.tile{padding:14px}.tile .v{font-size:24px}}

/* sections */
.sec{padding:76px 0 8px}
.sec-h{max-width:780px;margin-bottom:26px}
.sec-h .no{font-size:12px;letter-spacing:.14em;color:var(--ink3);text-transform:uppercase}
.sec-h h2{font-family:var(--serif);font-weight:400;font-size:clamp(30px,4vw,42px);line-height:1.12;letter-spacing:-.015em;margin:8px 0 10px}
.sec-h p{margin:0;color:var(--ink2);font-size:15.5px}
.stack{display:grid;gap:20px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.verdict{font-family:var(--serif);font-size:clamp(19px,2.3vw,24px);line-height:1.5;max-width:900px;margin:0 0 28px;letter-spacing:-.005em}
.verdict .sotf{font-family:var(--sans);font-size:13px;vertical-align:3px;margin:0 2px}

/* heatmap */
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px;padding:0 2px}
table{border-collapse:collapse;width:100%;font-size:13px}
.heat th,.heat td{padding:0;text-align:center;font-variant-numeric:tabular-nums}
.heat th{font-weight:500;color:var(--ink2);font-size:12px;padding:6px 4px 10px;white-space:nowrap;vertical-align:bottom}
.heat td.m{text-align:left;white-space:nowrap;padding:0 14px 0 0;position:sticky;left:0;background:#fff;z-index:1}
.heat td.m span{display:inline-flex;align-items:center;gap:8px}
.heat td.c{height:34px;min-width:58px;border:2px solid #fff;border-radius:6px}
.heat td.ix{font-weight:600;padding-left:10px}
.heat tr.r1 td.m{font-weight:600}

/* toggles */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px;flex:none}
.seg button{border:0;background:none;border-radius:6px;padding:4px 10px;font-size:12.5px;color:var(--ink2)}
.seg button.on{background:var(--ink);color:#fff}

/* legend */
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink2);margin:-4px 0 12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:block}

/* radar */
.radars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:1060px){.radars{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){.radars{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.rc{border:1px solid var(--line);border-radius:12px;padding:14px 14px 8px}
.rc-h{display:flex;align-items:center;gap:8px;min-width:0}
.rc-h .n{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.rc-h .s{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.rc .chart{min-height:0;aspect-ratio:1/.86}
@media (max-width:760px){#radars .rc{padding:10px 8px 4px}#radars .rc-h{flex-wrap:wrap;row-gap:0}#radars .rc-h .n{font-size:12px;flex-basis:calc(100% - 26px)}#radars .rc-h .s{padding-left:26px;font-size:11px}}

/* model table */
.mt th,.mt td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.mt th{font-size:12px;font-weight:500;color:var(--ink2);border-bottom:1px solid #d9d6cd;cursor:pointer;user-select:none}
.mt th.num,.mt td.num{text-align:right;font-variant-numeric:tabular-nums}
.mt th .ar{color:var(--ink3);font-size:10px;margin-left:3px}
.mt td.m{position:sticky;left:0;background:#fff;font-weight:600}
.mt td.m span,.mt td.co span{display:inline-flex;align-items:center;gap:8px}
.mt sup{color:var(--accent);font-weight:600;margin-left:2px}
.mt tr:hover td{background:var(--ivory)}
.notes{font-size:12.5px;color:var(--ink2);margin:14px 0 0;padding-left:0;list-style:none;display:grid;gap:3px}
.notes sup{color:var(--accent);font-weight:600;margin-right:4px}

/* method */
.method{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:900px){.method{grid-template-columns:1fr}}
.method h4{font-family:var(--serif);font-weight:400;font-size:19px;margin:0 0 8px}
.method p,.method li{font-size:14px;color:var(--ink2);line-height:1.65}
.method ol,.method ul{margin:0;padding-left:20px}
.method dl{margin:0;display:grid;gap:10px}
.method dt{font-weight:600;font-size:14px}
.method dd{margin:2px 0 0;font-size:13.5px;color:var(--ink2)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em;background:var(--ivory);border:1px solid var(--line);border-radius:4px;padding:0 4px}

footer{margin-top:88px;border-top:1px solid var(--line);padding:28px 0 48px;font-size:13px;color:var(--ink2)}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}

/* tooltip */
#tip{position:fixed;z-index:200;pointer-events:none;background:#fff;border:1px solid #dcd9d0;border-radius:10px;box-shadow:0 6px 24px rgba(20,20,19,.08);padding:9px 12px;font-size:12.5px;line-height:1.5;max-width:280px;opacity:0;transition:opacity .12s;left:0;top:0}
#tip.on{opacity:1}
#tip b{display:block;font-weight:600;margin-bottom:2px}
#tip .r{display:flex;justify-content:space-between;gap:14px;color:var(--ink2)}
#tip .r em{font-style:normal;color:var(--ink);font-variant-numeric:tabular-nums}
#tip .r i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}

/* chart reveal */
.rv{opacity:0;transition:opacity .45s ease var(--d,0s)}
.rv.on{opacity:1}
.grow{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);transition:transform .75s cubic-bezier(.2,.75,.2,1) var(--d,0s)}
.hgrow{transform-box:fill-box;transform-origin:0 50%;transform:scaleX(0);transition:transform .75s cubic-bezier(.2,.75,.2,1) var(--d,0s)}
.pop{transform-box:fill-box;transform-origin:50% 50%;transform:scale(.4);transition:transform .5s cubic-bezier(.3,1.5,.5,1) var(--d,0s)}
.on .grow,.on .hgrow,.on .pop,.on.pop{transform:none}
.draw{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.1s cubic-bezier(.4,0,.2,1) var(--d,0s)}
.on .draw,.on.draw{stroke-dashoffset:0}
@media (prefers-reduced-motion:reduce){.rv,.grow,.hgrow,.pop,.draw{transition:none!important}}

/* ===== video mode ===== */
#vm{position:fixed;inset:0;z-index:100;background:#efeee9;display:none;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#vm.open{display:block}
body.vm-open{overflow:hidden}
#stage{position:absolute;left:50%;top:50%;background:#fff;overflow:hidden;transform-origin:50% 50%;box-shadow:0 0 0 1px rgba(20,20,19,.06)}
.sl{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(var(--k)*34px) calc(var(--k)*40px) calc(var(--k)*20px);background:#fff;animation:slIn .5s ease both}
@keyframes slIn{from{opacity:0;transform:translateY(calc(var(--k)*8px))}to{opacity:1;transform:none}}
.sl-eb{font-size:calc(var(--k)*10.5px);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);display:flex;gap:calc(var(--k)*10px);align-items:center}
.sl-eb b{color:var(--ink);font-weight:600}
.sl-t{font-family:var(--serif);font-size:calc(var(--k)*30px);line-height:1.12;letter-spacing:-.015em;margin-top:calc(var(--k)*8px)}
.sl-s{font-size:calc(var(--k)*12.5px);color:var(--ink2);margin-top:calc(var(--k)*6px);line-height:1.45;max-width:62em}
.sl-c{flex:1;position:relative;min-height:0;margin-top:calc(var(--k)*18px)}
.sl-c svg{display:block;overflow:visible;font-family:var(--sans)}
.sl-f{display:flex;justify-content:space-between;gap:calc(var(--k)*10px);font-size:calc(var(--k)*9.5px);color:var(--ink3);border-top:1px solid var(--line);padding-top:calc(var(--k)*9px);margin-top:calc(var(--k)*12px);white-space:nowrap}
.sl-f .sig{color:var(--ink2);font-weight:500}
.sl-legend{display:flex;flex-wrap:wrap;gap:calc(var(--k)*5px) calc(var(--k)*14px);font-size:calc(var(--k)*10.5px);color:var(--ink2);margin-top:calc(var(--k)*8px)}
.sl-legend span{display:inline-flex;align-items:center;gap:calc(var(--k)*5px)}
.sl-legend i{width:calc(var(--k)*9px);height:calc(var(--k)*9px);border-radius:calc(var(--k)*2px);display:block}
/* title slide */
.ts{justify-content:center}
.ts .big{font-family:var(--serif);font-size:calc(var(--k)*var(--f,1)*60px);line-height:1.04;letter-spacing:-.025em;margin:calc(var(--k)*14px) 0 calc(var(--k)*16px)}
.ts .sub{font-size:calc(var(--k)*15px);color:var(--ink2);max-width:34em;line-height:1.5}
.ts .sgn{margin-top:calc(var(--k)*26px);font-size:calc(var(--k)*13px);display:flex;gap:calc(var(--k)*10px);align-items:center;flex-wrap:wrap}
.ts .sgn b{font-weight:600}
.ts .chips{display:flex;flex-wrap:wrap;gap:calc(var(--k)*8px);margin-top:calc(var(--k)*28px)}
.ts .chips span{border:1px solid var(--line);border-radius:999px;padding:calc(var(--k)*4px) calc(var(--k)*12px);font-size:calc(var(--k)*11.5px);color:var(--ink2)}
.ts .logos{display:flex;gap:calc(var(--k)*12px);margin-top:calc(var(--k)*22px)}
.ts .logos i{width:calc(var(--k)*24px);height:calc(var(--k)*24px)}
.ts .big .w{display:inline-block;white-space:nowrap}
.ts .txtcol{position:relative;z-index:1;max-width:62%}
.ts-mark{position:absolute;right:calc(var(--k)*80px);top:50%;transform:translateY(-50%);display:flex;align-items:flex-end;gap:calc(var(--k)*20px);height:calc(var(--k)*300px)}
.ts-mark i{display:block;width:calc(var(--k)*58px);border-radius:calc(var(--k)*6px) calc(var(--k)*6px) 0 0;background:var(--ink);transform:scaleY(0);transform-origin:50% 100%;transition:transform .9s cubic-bezier(.2,.75,.2,1)}
.ts-mark i:last-child{background:var(--accent)}
.ts-mark.on i{transform:none}
.ts-mark.on i:nth-child(2){transition-delay:.12s}.ts-mark.on i:nth-child(3){transition-delay:.24s}
.vs.rv{transform:translateY(calc(var(--k)*10px));transition:opacity .5s ease,transform .6s cubic-bezier(.2,.75,.2,1)}
.vs.rv.on{transform:none}
/* conclusion slide */
.cs .who{display:flex;align-items:center;gap:calc(var(--k)*16px);margin-top:calc(var(--k)*18px)}
.cs .who .lg{width:calc(var(--k)*var(--f,1)*54px);height:calc(var(--k)*var(--f,1)*54px)}
.cs .nm{font-family:var(--serif);font-size:calc(var(--k)*var(--f,1)*44px);line-height:1.05;letter-spacing:-.02em}
.cs .sc{display:flex;align-items:baseline;gap:calc(var(--k)*12px);margin-top:calc(var(--k)*14px);flex-wrap:wrap}
.cs .sc b{font-size:calc(var(--k)*var(--f,1)*72px);font-weight:600;letter-spacing:-.03em;line-height:.95}
.cs .sc span{font-size:calc(var(--k)*13px);color:var(--ink3)}
.cs .sotf{font-size:calc(var(--k)*13px);padding:calc(var(--k)*5px) calc(var(--k)*13px) calc(var(--k)*5px) calc(var(--k)*10px);gap:calc(var(--k)*7px)}
.cs .sotf i{width:calc(var(--k)*7px);height:calc(var(--k)*7px)}
.cs .txt{font-family:var(--serif);font-size:calc(var(--k)*var(--f,1)*19px);line-height:1.5;margin-top:calc(var(--k)*var(--f,1)*20px);max-width:36em}
.cs .podium{display:grid;gap:calc(var(--k)*var(--f,1)*8px);margin-top:calc(var(--k)*var(--f,1)*22px);max-width:calc(var(--k)*560px)}
.cs .podium div{display:flex;align-items:center;gap:calc(var(--k)*10px);font-size:calc(var(--k)*var(--f,1)*13px);border-top:1px solid var(--line);padding-top:calc(var(--k)*8px)}
.cs .podium .r{color:var(--ink3);width:calc(var(--k)*22px);font-variant-numeric:tabular-nums}
.cs .podium .lg{width:calc(var(--k)*18px);height:calc(var(--k)*18px)}
.cs .podium .n{flex:1}
.cs .podium .v{font-weight:600;font-variant-numeric:tabular-nums}
/* radar grid in stage */
.sr{display:grid;height:100%;gap:calc(var(--k)*12px)}
.sr .rc{padding:calc(var(--k)*10px) calc(var(--k)*12px) 0;border-radius:calc(var(--k)*10px);display:flex;flex-direction:column;min-height:0}
.sr .rc-h{gap:0 calc(var(--k)*6px);flex-wrap:wrap}
.sr .rc-h .n{flex-basis:calc(100% - var(--k)*22px)}
.sr .rc-h .s{padding-left:calc(var(--k)*22px)}
.sr .rc-h .n{font-size:calc(var(--k)*12px)}
.sr .rc-h .s{font-size:calc(var(--k)*11px)}
.sr .rc-h .lg{width:calc(var(--k)*16px);height:calc(var(--k)*16px)}
.sr .rc .rb{flex:1;min-height:0;position:relative}

/* control bar */
#vbar{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:110;display:flex;align-items:center;gap:2px;background:rgba(20,20,19,.9);color:#fff;border-radius:999px;padding:5px 8px;transition:transform .3s ease,opacity .3s ease;box-shadow:0 6px 24px rgba(0,0,0,.18)}
#vbar.hid{transform:translate(-50%,160%);opacity:0;pointer-events:none}
#vbar button{width:40px;height:40px;border:0;background:none;border-radius:50%;display:grid;place-items:center;color:#fff;padding:0}
#vbar button:hover{background:rgba(255,255,255,.12)}
#vbar button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#vbar .ar{width:auto;padding:0 10px;border-radius:999px;font-size:12.5px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
#vbar .cnt{white-space:nowrap;font-size:12px;color:rgba(255,255,255,.7);padding:0 8px;font-variant-numeric:tabular-nums;min-width:52px;text-align:center}
#vbar .sep{width:1px;height:20px;background:rgba(255,255,255,.18);margin:0 4px}
#vbar .prog{position:absolute;left:18px;right:18px;top:0;height:2px;border-radius:2px;overflow:hidden}
#vbar .prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
@media (max-width:480px){#vbar{padding:4px 4px}#vbar button{width:36px;height:36px}#vbar .cnt{min-width:40px;padding:0 4px}#vbar .fsb{display:none}}

<main id="top">
  <section class="hero" id="index">
    <div class="wrap">
      <div class="eyebrow" data-t="heroEb"></div>
      <h1></h1>

  </section>

  <section class="sec" id="verdict-sec">

      <div class="sec-h"><div class="no">01</div><h2 data-t="verdictT"></h2></div>

        <div class="card-h"><div><h3 data-t="heatT"></h3><p data-t="heatSub"></p></div></div>
        <div class="scroll-x" id="heat"></div>
      </div>
    </div>
  </section>

  <section class="sec" id="metrics">

      <div class="sec-h"><div class="no">02</div><h2 data-t="metricsH2"></h2><p data-t="metricsLede"></p></div>
      <div class="stack" id="metricCards"></div>
    </div>
  </section>

  <section class="sec" id="frontier">
    <div class="wrap">
      <div class="sec-h"><div class="no">03</div><h2 data-t="frontierH2"></h2><p data-t="frontierLede"></p></div>
      <div class="card">
        <div class="card-h"><div><h3 data-t="scatterT"></h3><p data-t="scatterSub"></p></div>
          <div class="seg" id="priceSeg"><button type="button" data-p="bl" class="on" data-t="pBl"></button><button type="button" data-p="pin" data-t="pIn"></button><button type="button" data-p="pout" data-t="pOut"></button></div>
        </div>
        <div class="chart" data-chart="scatter"></div>
      </div>
    </div>
  </section>

  <section class="sec" id="inflation">

      <div class="sec-h"><div class="no">04</div><h2 data-t="inflH2"></h2><p data-t="inflLede"></p></div>

          <div class="card-h"><div><h3 data-t="trendT"></h3><p data-t="trendSub"></p></div></div>

            <div class="card-h"><div><h3 data-t="serT"></h3><p data-t="serSub"></p></div><span class="hib" data-t="higher"></span></div>
            <div class="chart" data-chart="series"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="sec" id="profiles">
    <div class="wrap">
      <div class="sec-h"><div class="no">05</div><h2 data-t="radarH2"></h2><p data-t="radarLede"></p></div>
      <div class="radars" id="radars"></div>
    </div>
  </section>

  <section class="sec" id="models">
    <div class="wrap">
      <div class="sec-h"><div class="no">06</div><h2 data-t="modelsH2"></h2><p data-t="modelsLede"></p></div>

        <div class="scroll-x"><table class="mt" id="mt"></table></div>
        <ul class="notes" id="notes"></ul>
      </div>
    </div>
  </section>

      <div class="sec-h"><div class="no">07</div><h2 data-t="methodH2"></h2></div>
      <div class="method" id="methodBody"></div>
    </div>
  </section>

function tw(s, fs){
  var w=0; s=String(s);
  for(var i=0;i<s.length;i++){
    var c=s.charCodeAt(i), ch=s[i];
    if(c>0x2e80) w+=1;
    else if(ch===' ') w+=.28;
    else if(ch==='.'||ch===','||ch===':'||ch==='|'||ch==='i'||ch==='l'||ch==='I'||ch==='j') w+=.27;
    else if(ch==='-'||ch==='('||ch===')'||ch==='/'||ch==='t'||ch==='f'||ch==='r') w+=.35;
    else if(ch==='m'||ch==='w'||ch==='M'||ch==='W') w+=.84;
    else if(ch>='A'&&ch<='Z') w+=.66;
    else if(ch>='0'&&ch<='9') w+=.57;

    else w+=.54;
  }
  return w*fs;
}

function rowPath(x,y,w,h,r){
  if(w<=0) return '';
  r=Math.min(r,h/2,w);
  return 'M'+r1(x)+','+r1(y)+'H'+r1(x+w-r)+'Q'+r1(x+w)+','+r1(y)+' '+r1(x+w)+','+r1(y+r)+'V'+r1(y+h-r)+'Q'+r1(x+w)+','+r1(y+h)+' '+r1(x+w-r)+','+r1(y+h)+'H'+r1(x)+'Z';
}
function wrapName(name, maxCh){
  var toks=name.replace(/-/g,'-\u0000').split(/[ \u0000]/), lines=[], cur='';
  // keep the hyphen with the left part
  toks.forEach(function(tk){
    var sep = cur && !/-$/.test(cur) ? ' ' : '';
    if(!cur){ cur=tk; }
    else if((cur+sep+tk).length<=maxCh){ cur=cur+sep+tk; }
    else { lines.push(cur); cur=tk; }
  });
  if(cur) lines.push(cur);
  return lines;
}
function tipAttr(title, rows){
  var s=esc(title)+'\u001e'+rows.map(function(r){return esc(r[0])+'\u001f'+esc(r[1])+(r[2]?'\u001f'+r[2]:'');}).join('\u001e');
  return ' data-tip="'+s+'"';
}
function svgOpen(w,h,label){ return '<svg viewBox="0 0 '+r1(w)+' '+r1(h)+'" width="'+r1(w)+'" height="'+r1(h)+'" role="img" aria-label="'+esc(label||'')+'">'; }

function modelItem(m, k){
  return {name:m.name, logo:VEND[m.v].logo, v:m.val[k], label:fmtVal(k,m.val[k],m), vend:m.v, i:m.i,
    tip:tipAttr(m.name, [[metricTitle(k), fmtVal(k,m.val[k],m)],[t('idxCol'), fmtVal('idx',m.idx)],[t('thCo'), L(VEND[m.v].co)]])};
}

/* vertical column chart (AA style) */
function colChart(o){
  var k=o.k||1, fs=11*k, items=o.items.slice().sort(function(a,b){return (b.v-a.v)||(a.i-b.i);}), n=items.length;
  var tk=ticks(o.max||items[0].v, 4), max=tk[tk.length-1];
  var tkW=Math.max.apply(null, tk.map(function(v){return tw((o.tickFmt||tickFmt)(v), fs*.95);}));
  var padL=tkW+10*k, padR=4*k, padT=22*k;
  var slot=(o.w-padL-padR)/n;
  var maxCh=Math.max(4, Math.floor(slot/(fs*.6)));
  var lines=items.map(function(it){ return wrapName(it.name, maxCh); });
  var nl=Math.max.apply(null, lines.map(function(l){return l.length;}));
  var logoS=Math.min(20*k, slot*.42);
  var padB=8*k+logoS+6*k+nl*fs*1.18+2*k;
  var ph=Math.max(40, o.h-padT-padB);
  var bw=Math.min(30*k, slot*.56);
  var s=svgOpen(o.w,o.h,o.label);
  tk.forEach(function(v){
    var y=padT+ph-ph*v/max;
    s+='<line x1="'+r1(padL)+'" x2="'+r1(o.w-padR)+'" y1="'+r1(y)+'" y2="'+r1(y)+'" stroke="'+(v===0?'#cfccc3':'#efede8')+'" stroke-width="1" shape-rendering="crispEdges"/>';
    s+='<text x="'+r1(padL-8*k)+'" y="'+r1(y+fs*.35)+'" text-anchor="end" font-size="'+r1(fs*.95)+'" fill="#8f8d86">'+(o.tickFmt||tickFmt)(v)+'</text>';
  });
  items.forEach(function(it,i){
    var cx=padL+slot*i+slot/2, bh=ph*it.v/max, y0=padT+ph;
    var step = o.revealHighFirst ? i : n-1-i;
    s+='<g class="rv" data-s="'+step+'" data-o="'+i+'"'+(it.tip||'')+'>';
    s+='<rect x="'+r1(padL+slot*i)+'" y="'+r1(padT-10*k)+'" width="'+r1(slot)+'" height="'+r1(ph+padB+10*k)+'" fill="transparent"/>';
    s+='<path class="grow" d="'+colPath(cx-bw/2, y0-bh, bw, bh, 4*k)+'" fill="'+(it.fill||fill(it.vend,'V'))+'"/>';
    s+='<text x="'+r1(cx)+'" y="'+r1(y0-bh-6*k)+'" text-anchor="middle" font-size="'+r1(fs*1.04)+'" font-weight="600" fill="#141413">'+esc(it.label)+'</text>';
    if(it.logo) s+=useLogo(it.logo, cx-logoS/2, y0+8*k, logoS);
    lines[i].forEach(function(ln,j){
      s+='<text x="'+r1(cx)+'" y="'+r1(y0+8*k+(it.logo?logoS+6*k:0)+fs*.95+j*fs*1.18)+'" text-anchor="middle" font-size="'+r1(fs)+'" fill="#5e5d59">'+esc(ln)+'</text>';
    });
    s+='</g>';
  });
  return s+'</svg>';
}

/* horizontal bar chart */
function barChart(o){
  var k=o.k||1, fs=(o.fs||12)*k, items=o.items.slice().sort(function(a,b){return (b.v-a.v)||(a.i-b.i);}), n=items.length;
  var rowH=o.rowH||Math.max(fs*2.3, 26*k);
  var logoS=Math.min(17*k*(o.fs?o.fs/12:1), rowH*.62);
  var rankW=o.rank ? tw('16',fs)+fs*.8 : 0;
  var nameW=Math.max.apply(null, items.map(function(it){return tw(it.name,fs);}));
  var labW=rankW+logoS+7*k+nameW+12*k;
  var valW=Math.max.apply(null, items.map(function(it){return tw(it.label,fs*1.02);}))+10*k;
  var tagFs=fs*.8, tagW=o.tag ? tw(o.tag,tagFs)+tagFs*2.3 : 0;
  var tagAfter = o.tag && (o.w-labW-valW-tagW-10*k) > o.w*.38;
  var plotW=o.w-labW-valW-(tagAfter?tagW+8*k:0);
  var max=o.max||items[0].v;
  var tagMode = !o.tag ? null : tagAfter ? 'after' : (plotW*items[0].v/max > tagW+14*k ? 'inside' : 'below');
  var extra = tagMode==='below' ? tagFs*2.2 : 0;
  var bh=Math.min(20*k, rowH*.54);
  var top=o.padT!=null?o.padT:2*k;
  var h=top+n*rowH+extra;
  var s=svgOpen(o.w,h,o.label);
  s+='<line x1="'+r1(labW)+'" x2="'+r1(labW)+'" y1="'+r1(top)+'" y2="'+r1(h)+'" stroke="#cfccc3" stroke-width="1" shape-rendering="crispEdges"/>';
  items.forEach(function(it,i){
    var y=top+i*rowH+(i>0?extra:0), cy=y+rowH/2, w=plotW*it.v/max;
    var step = o.revealHighFirst ? i : n-1-i;
    s+='<g class="rv" data-s="'+step+'" data-o="'+i+'"'+(it.tip||'')+'>';
    s+='<rect x="0" y="'+r1(y)+'" width="'+r1(o.w)+'" height="'+r1(rowH+(i===0?extra:0))+'" fill="transparent"/>';
    var x=0;
    if(o.rank){ s+='<text x="'+r1(rankW-fs*.7)+'" y="'+r1(cy+fs*.35)+'" text-anchor="end" font-size="'+r1(fs*.92)+'" fill="#8f8d86" style="font-variant-numeric:tabular-nums">'+(i+1)+'</text>'; x=rankW; }
    if(it.logo) s+=useLogo(it.logo, x, cy-logoS/2, logoS);
    s+='<text x="'+r1(x+logoS+7*k)+'" y="'+r1(cy+fs*.35)+'" font-size="'+r1(fs)+'" fill="#141413"'+(i===0&&o.rank?' font-weight="600"':'')+'>'+esc(it.name)+'</text>';
    s+='<path class="hgrow" d="'+rowPath(labW+1, cy-bh/2, Math.max(w,1), bh, 4*k)+'" fill="'+(it.fill||fill(it.vend,'H'))+'"/>';
    s+='<text x="'+r1(labW+w+7*k)+'" y="'+r1(cy+fs*.36)+'" font-size="'+r1(fs*1.02)+'" font-weight="600" fill="#141413" style="font-variant-numeric:tabular-nums">'+esc(it.label)+'</text>';
    if(o.tag && i===0){
      var tx, inside=false, th=tagFs*1.75;
      if(tagMode==='after'){ tx=labW+w+7*k+tw(it.label,fs*1.02)+10*k; }
      else if(tagMode==='inside'){ tx=labW+w-tagW-5*k; inside=true; }
      else { tx=x+logoS+7*k; cy=y+rowH+extra/2-th*.25; }
      s+='<g class="pop" style="--d:inherit">';
      s+='<rect x="'+r1(tx)+'" y="'+r1(cy-th/2)+'" width="'+r1(tagW)+'" height="'+r1(th)+'" rx="'+r1(th/2)+'" fill="'+(inside?'#ffffff':'#141413')+'"/>';
      s+='<circle cx="'+r1(tx+tagFs*.95)+'" cy="'+r1(cy)+'" r="'+r1(tagFs*.28)+'" fill="#d97757"/>';
      s+='<text x="'+r1(tx+tagFs*1.55)+'" y="'+r1(cy+tagFs*.36)+'" font-size="'+r1(tagFs)+'" font-weight="500" fill="'+(inside?'#141413':'#ffffff')+'">'+esc(o.tag)+'</text>';
      s+='</g>';
    }
    s+='</g>';
  });
  return {svg:s+'</svg>', h:h};
}

/* scatter: version vs price */
function scatterChart(o){
  var k=o.k||1, fs=11*k, pk=o.pk||'bl', narrow=o.w<560*k;
  var padL=34*k, padR=14*k, padT=14*k, padB=40*k;
  var pw=o.w-padL-padR, ph=o.h-padT-padB;
  var xmin=Math.log10(0.1), xmax=Math.log10(50), ymin=2.5, ymax=6.5;
  function X(p){ return padL+pw*(Math.log10(p)-xmin)/(xmax-xmin); }
  function Y(v){ return padT+ph-ph*(v-ymin)/(ymax-ymin); }
  var pts=MODELS.map(function(m){ return {m:m, p:pk==='bl'?m.bl:m[pk], v:m.ver}; });
  var ps=pts.map(function(d){return d.p;}).sort(function(a,b){return a-b;}), vs=pts.map(function(d){return d.v;}).sort(function(a,b){return a-b;});
  var medP=(ps[7]+ps[8])/2, medV=(vs[7]+vs[8])/2;
  var s=svgOpen(o.w,o.h,o.label);
  // quadrant
  s+='<rect class="rv" data-s="0" data-o="0" x="'+r1(padL)+'" y="'+r1(padT)+'" width="'+r1(X(medP)-padL)+'" height="'+r1(Y(medV)-padT)+'" fill="#f4f1ea"/>';
  // grid
  [3,4,5,6].forEach(function(v){
    s+='<line x1="'+r1(padL)+'" x2="'+r1(o.w-padR)+'" y1="'+r1(Y(v))+'" y2="'+r1(Y(v))+'" stroke="#efede8" shape-rendering="crispEdges"/>';
    s+='<text x="'+r1(padL-8*k)+'" y="'+r1(Y(v)+fs*.35)+'" text-anchor="end" font-size="'+r1(fs*.95)+'" fill="#8f8d86">'+v+'.0</text>';
  });
  var xt = narrow ? [0.1,0.5,1,5,10,50] : [0.1,0.2,0.5,1,2,5,10,20,50];
  xt.forEach(function(p){
    s+='<line x1="'+r1(X(p))+'" x2="'+r1(X(p))+'" y1="'+r1(padT)+'" y2="'+r1(padT+ph)+'" stroke="#f3f1ec" shape-rendering="crispEdges"/>';
    s+='<text x="'+r1(X(p))+'" y="'+r1(padT+ph+fs*1.5)+'" text-anchor="middle" font-size="'+r1(fs*.95)+'" fill="#8f8d86">$'+(p<1?p.toFixed(1):p)+'</text>';
  });
  s+='<line x1="'+r1(padL)+'" x2="'+r1(o.w-padR)+'" y1="'+r1(padT+ph)+'" y2="'+r1(padT+ph)+'" stroke="#cfccc3" shape-rendering="crispEdges"/>';
  s+='<text x="'+r1(padL+pw/2)+'" y="'+r1(o.h-4*k)+'" text-anchor="middle" font-size="'+r1(fs*.95)+'" fill="#5e5d59">'+esc(t('xPrice'))+'</text>';
  var qfs=fs*.95, qx=padL+8*k, qy=Y(medV)-8*k;
  s+='<text class="rv" data-s="0" data-o="0" x="'+r1(qx)+'" y="'+r1(qy)+'" font-size="'+r1(qfs)+'" font-weight="600" fill="#8a6a55">'+esc(t('quad'))+'</text>';
  // pareto frontier: best version at or below each price
  var sorted=pts.slice().sort(function(a,b){return (a.p-b.p)||(b.v-a.v);}), fr=[], best=-1;
  sorted.forEach(function(d){ if(d.v>best+1e-9){ fr.push(d); best=d.v; } });
  var d='M'+r1(X(fr[0].p))+','+r1(padT+ph)+'V'+r1(Y(fr[0].v));
  for(var i=1;i<fr.length;i++){ d+='H'+r1(X(fr[i].p))+'V'+r1(Y(fr[i].v)); }
  d+='H'+r1(o.w-padR);
  var nPts=pts.length;
  s+='<path class="draw rv" data-s="'+(nPts+1)+'" data-o="'+(nPts+1)+'" d="'+d+'" pathLength="1" fill="none" stroke="#141413" stroke-width="'+r1(1.5*k)+'" stroke-linejoin="round" opacity=".75"/>';
  var lastV=fr[fr.length-1].v, segs=[];
  segs.push({x:X(fr[0].p)-3*k, y:Y(fr[0].v), w:6*k, h:padT+ph-Y(fr[0].v)});
  for(i=1;i<fr.length;i++){ segs.push({x:X(fr[i-1].p), y:Y(fr[i-1].v)-3*k, w:X(fr[i].p)-X(fr[i-1].p), h:6*k}); segs.push({x:X(fr[i].p)-3*k, y:Y(fr[i].v), w:6*k, h:Y(fr[i-1].v)-Y(fr[i].v)}); }
  segs.push({x:X(fr[fr.length-1].p), y:Y(lastV)-3*k, w:o.w-padR-X(fr[fr.length-1].p), h:6*k});
  // points + labels (greedy placement)
  var R=Math.max(9*k, Math.min(12*k, o.w/70)), placed=[], boxes=pts.map(function(d){ return {x:X(d.p)-R,y:Y(d.v)-R,w:2*R,h:2*R}; });
  // pareto label: first free slot along the top horizontal segment, scanning right to left
  var pfs=fs*.92, pw_=tw(t('pareto'),pfs), pBox=null, xs=X(fr[fr.length-1].p);
  for(var px=o.w-padR-pw_; px>=xs-2 && !pBox; px-=6*k){
    [[Y(lastV)-6*k-pfs],[Y(lastV)+6*k]].forEach(function(c){ if(pBox) return; var b={x:px,y:c[0],w:pw_,h:pfs*1.2}; if(!hit(b)) pBox=b; });
  }
  if(!pBox) pBox={x:o.w-padR-pw_, y:Y(lastV)+6*k, w:pw_, h:pfs*1.2};
  boxes.push(pBox);
  s+='<text class="rv" data-s="'+(nPts+1)+'" data-o="'+(nPts+1)+'" x="'+r1(pBox.x)+'" y="'+r1(pBox.y+pfs*.92)+'" font-size="'+r1(pfs)+'" fill="#5e5d59">'+esc(t('pareto'))+'</text>';
  boxes.push({x:qx, y:qy-qfs, w:tw(t('quad'),qfs), h:qfs*1.25});
  boxes=boxes.concat(segs);
  function hit(b){ for(var j=0;j<boxes.length;j++){ var c=boxes[j]; if(b.x<c.x+c.w&&b.x+b.w>c.x&&b.y<c.y+c.h&&b.y+b.h>c.y) return true; } return false; }
  var order=pts.slice().sort(function(a,b){return (a.p-b.p)||(b.v-a.v);});
  var lfs=fs*(narrow?.88:.95);
  order.forEach(function(dd,idx){
    var cx=X(dd.p), cy=Y(dd.v), name=dd.m.name;
    if(narrow) name=name.replace(/^Claude /,'').replace(/^DeepSeek /,'DS ');
    var w=tw(name,lfs), h=lfs*1.2;
    var cands=[[cx+R+4*k, cy-h/2,'start'],[cx-R-4*k-w, cy-h/2,'end'],[cx-w/2, cy-R-3*k-h,'mid'],[cx-w/2, cy+R+3*k,'mid'],[cx+R*.7, cy-R-h,'start'],[cx+R*.7, cy+R,'start'],[cx-R*.7-w, cy-R-h,'end'],[cx-R*.7-w, cy+R,'end']];
    var pick=null;
    for(var c=0;c<cands.length;c++){ var b={x:cands[c][0],y:cands[c][1],w:w,h:h}; if(b.x<padL+2||b.x+b.w>o.w-2||b.y<padT||b.y+b.h>padT+ph) continue; if(!hit(b)){ pick=b; break; } }
    if(!pick) pick={x:cx+R+4*k,y:cy-h/2,w:w,h:h};
    boxes.push(pick);
    var m=dd.m;
    s+='<g class="rv" data-s="'+(idx+1)+'" data-o="'+(idx+1)+'"'+tipAttr(m.name,[[t('yVer'),f1(m.ver)],[t('thBl'),money(m.bl)],[t('thIn'),money(m.pin)],[t('thOut'),money(m.pout)]])+'>';
    s+='<g class="pop"><circle cx="'+r1(cx)+'" cy="'+r1(cy)+'" r="'+r1(R+2*k)+'" fill="#fff"/><circle cx="'+r1(cx)+'" cy="'+r1(cy)+'" r="'+r1(R)+'" fill="#fff" stroke="'+fill(m.v,'D')+'" stroke-width="'+r1(2*k)+'"/>'+useLogo(VEND[m.v].logo, cx-R*.62, cy-R*.62, R*1.24)+'</g>';
    s+='<text x="'+r1(pick.x)+'" y="'+r1(pick.y+lfs*.92)+'" font-size="'+r1(lfs)+'" fill="#141413">'+esc(name)+'</text>';
    s+='</g>';
  });
  return s+'</svg>';
}

/* trend: step lines of top version per series */
function dnum(iso){ return Date.UTC(+iso.slice(0,4), +iso.slice(5,7)-1, +iso.slice(8,10)); }
function trendChart(o){
  var k=o.k||1, fs=11*k;
  var x0=dnum('2022-11-01'), x1=dnum(ASOF)+20*864e5;
  var endW=tw('DeepSeek 4.1',fs)+fs*2.2+14*k;
  var padL=26*k, padR=endW, padT=10*k, padB=26*k;
  var pw=o.w-padL-padR, ph=o.h-padT-padB, ymax=6.5;
  function X(d){ return padL+pw*(d-x0)/(x1-x0); }
  function Y(v){ return padT+ph-ph*v/ymax; }
  var s=svgOpen(o.w,o.h,o.label);
  [0,1,2,3,4,5,6].forEach(function(v){
    s+='<line x1="'+r1(padL)+'" x2="'+r1(padL+pw)+'" y1="'+r1(Y(v))+'" y2="'+r1(Y(v))+'" stroke="'+(v===0?'#cfccc3':'#efede8')+'" shape-rendering="crispEdges"/>';
    s+='<text x="'+r1(padL-7*k)+'" y="'+r1(Y(v)+fs*.35)+'" text-anchor="end" font-size="'+r1(fs*.95)+'" fill="#8f8d86">'+v+'</text>';
  });
  [2023,2024,2025,2026].forEach(function(y){
    var x=X(Date.UTC(y,0,1));
    s+='<line x1="'+r1(x)+'" x2="'+r1(x)+'" y1="'+r1(padT)+'" y2="'+r1(padT+ph)+'" stroke="#f3f1ec" shape-rendering="crispEdges"/>';
    s+='<text x="'+r1(x)+'" y="'+r1(padT+ph+fs*1.55)+'" text-anchor="middle" font-size="'+r1(fs*.95)+'" fill="#8f8d86">'+y+'</text>';
  });
  var ends=[], xe=X(dnum(ASOF));
  VORDER.forEach(function(v,si){
    var h=HIST[v], d='', cur=null;
    h.forEach(function(p,j){
      var x=X(dnum(p[0])), y=Y(p[1]);
      if(j===0) d+='M'+r1(x)+','+r1(y); else d+='H'+r1(x)+'V'+r1(y);
      cur=p[1];
    });
    d+='H'+r1(xe);
    s+='<path class="draw rv" data-s="'+si+'" data-o="'+si+'" d="'+d+'" pathLength="1" fill="none" stroke="'+(VEND[v].grad?'url(#gemH)':VEND[v].color)+'" stroke-width="'+r1(2*k)+'" stroke-linejoin="round" stroke-linecap="round"/>';
    ends.push({v:v, y:Y(cur), ty:Y(cur), val:cur, si:si});
  });
  // spread end labels
  var gap=fs*1.55; ends.sort(function(a,b){return a.y-b.y;});
  for(var i=1;i<ends.length;i++) if(ends[i].ty<ends[i-1].ty+gap) ends[i].ty=ends[i-1].ty+gap;
  var over=ends[ends.length-1].ty-(padT+ph); if(over>0) ends.forEach(function(e){e.ty-=over;});
  for(i=ends.length-2;i>=0;i--) if(ends[i].ty>ends[i+1].ty-gap) ends[i].ty=ends[i+1].ty-gap;
  var lx=xe+12*k, ls=fs*1.15;
  ends.forEach(function(e){
    s+='<g class="rv" data-s="'+e.si+'" data-o="'+e.si+'" style="--d:'+(e.si*.12+.6)+'s">';
    s+='<circle cx="'+r1(xe)+'" cy="'+r1(e.y)+'" r="'+r1(4*k)+'" fill="'+(VEND[e.v].grad?'#FBBC04':VEND[e.v].color)+'" stroke="#fff" stroke-width="'+r1(2*k)+'"/>';
    if(Math.abs(e.ty-e.y)>1) s+='<path d="M'+r1(xe+5*k)+','+r1(e.y)+'L'+r1(lx-3*k)+','+r1(e.ty)+'" stroke="#cfccc3" fill="none"/>';
    s+=useLogo(VEND[e.v].logo, lx, e.ty-ls/2, ls);
    s+='<text x="'+r1(lx+ls+5*k)+'" y="'+r1(e.ty+fs*.36)+'" font-size="'+r1(fs)+'" fill="#141413">'+SERIES_NAME[e.v]+' <tspan font-weight="600">'+f1(e.val)+'</tspan></text>';
    s+='</g>';
  });
  if(o.interactive){
    s+='<g class="xh" style="display:none"><line y1="'+r1(padT)+'" y2="'+r1(padT+ph)+'" stroke="#141413" stroke-opacity=".35"/></g>';
    s+='<rect class="hitarea" x="'+r1(padL)+'" y="'+r1(padT)+'" width="'+r1(pw)+'" height="'+r1(ph)+'" fill="transparent" data-x0="'+x0+'" data-x1="'+x1+'" data-pl="'+r1(padL)+'" data-pw="'+r1(pw)+'" data-vw="'+r1(o.w)+'"/>';
  }
  return s+'</svg>';
}

/* radar */
function radarSvg(m, size, k, opts){
  k=k||1; opts=opts||{};
  var fs=(opts.fs||10)*k, padX=opts.padX!=null?opts.padX:tw('Parent ver.',fs)*.62+6*k, padY=fs*1.9;
  var w=size, h=opts.h||size;

function colChartKeep(o, max){

function moveTip(x,y){

  var px=x+14, py=y+14; if(px+tw_>vw-8) px=x-tw_-14; if(px<8) px=8; if(py+th>vh-8) py=y-th-14; if(py<8) py=8;
  tip.style.transform='translate('+Math.round(px)+'px,'+Math.round(py)+'px)';
}
function hideTip(){ tip.classList.remove('on'); tipOn=null; }
document.addEventListener('pointerover', function(e){
  if(e.pointerType!=='mouse' || VM.open) return;
  var el=e.target.closest && e.target.closest('[data-tip]');
  if(el){ if(el!==tipOn) showTip(el,e.clientX,e.clientY); } else if(tipOn) hideTip();
});
document.addEventListener('pointermove', function(e){ if(tipOn && e.pointerType==='mouse') moveTip(e.clientX,e.clientY); }, {passive:true});
document.addEventListener('pointerdown', function(e){
  if(VM.open) return;
  if(e.pointerType==='mouse') return;
  var el=e.target.closest && e.target.closest('[data-tip]');
  if(el) showTip(el,e.clientX,e.clientY); else hideTip();
}, {passive:true});
window.addEventListener('scroll', function(){ if(tipOn) hideTip(); }, {passive:true});

/* trend crosshair */
function trendHover(e){
  var r=e.target; if(!r.classList || !r.classList.contains('hitarea')) return;
  var svg=r.ownerSVGElement, bb=svg.getBoundingClientRect(), sc=bb.width/(+r.getAttribute('data-vw'));
  var px=(e.clientX-bb.left)/sc, pl=+r.getAttribute('data-pl'), pw=+r.getAttribute('data-pw');
  var f=Math.max(0,Math.min(1,(px-pl)/pw)), d=+r.getAttribute('data-x0')+f*(+r.getAttribute('data-x1')-(+r.getAttribute('data-x0')));
  var iso=new Date(Math.min(d, dnum(ASOF))).toISOString().slice(0,10);
  var g=svg.querySelector('.xh'); g.style.display=''; var ln=g.querySelector('line'); ln.setAttribute('x1',px); ln.setAttribute('x2',px);
  var rows=VORDER.map(function(v){ return [v, verAt(v,iso)]; }).filter(function(x){return x[1]!=null;}).sort(function(a,b){return b[1]-a[1];});
  r.setAttribute('data-tip', esc(fmtDate(iso))+'\u001e'+rows.map(function(x){return SERIES_NAME[x[0]]+'\u001f'+f1(x[1])+'\u001f'+cssFill(x[0]);}).join('\u001e'));
  showTip(r, e.clientX, e.clientY);
}
document.addEventListener('pointermove', function(e){ if(!VM.open && e.target.classList && e.target.classList.contains('hitarea')) trendHover(e); }, {passive:true});
document.addEventListener('pointerdown', function(e){ if(!VM.open && e.target.classList && e.target.classList.contains('hitarea')) trendHover(e); }, {passive:true});
document.addEventListener('pointerout', function(e){
  if(e.target.classList && e.target.classList.contains('hitarea') && e.pointerType==='mouse'){ var g=e.target.ownerSVGElement.querySelector('.xh'); if(g) g.style.display='none'; hideTip(); }
});

var SND={ctx:null, out:null, on:true,
  init:function(){
    if(!this.ctx){ var C=window.AudioContext||window.webkitAudioContext; if(!C) return; this.ctx=new C();
      var comp=this.ctx.createDynamicsCompressor(); comp.connect(this.ctx.destination);
      var lp=this.ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=5200; lp.connect(comp);
      this.out=this.ctx.createGain(); this.out.gain.value=.9; this.out.connect(lp); }
    if(this.ctx.state==='suspended') this.ctx.resume();
  },
  tone:function(f, at, dur, g, type, f2){
    if(!this.on||!this.ctx) return;
    var c=this.ctx, t0=c.currentTime+(at||0), o=c.createOscillator(), gn=c.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t0); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t0+dur*.9);
    gn.gain.setValueAtTime(0.0001,t0); gn.gain.exponentialRampToValueAtTime(g,t0+.008); gn.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(gn); gn.connect(this.out); o.start(t0); o.stop(t0+dur+.02);
  },
  tick:function(p){ var f=440*Math.pow(2,(p||0)*14/12); this.tone(f,0,.09,.05,'sine'); this.tone(f*2,0,.05,.012,'triangle'); },
  pop:function(){ this.tone(660,0,.12,.04,'sine',880); },
  page:function(){ this.tone(392,0,.22,.022,'sine',523); this.tone(784,.05,.18,.01,'sine'); },
  line:function(i){ var f=220*Math.pow(2,(i||0)*2/12); this.tone(f,0,.5,.03,'triangle',f*1.5); },
  chord:function(){ var s=this; [523.25,659.25,783.99,1046.5].forEach(function(f,i){ s.tone(f,i*.07,1.6,.035,'sine'); s.tone(f*2,i*.07,.6,.006,'triangle'); }); }
};
try{ if(localStorage.getItem('beachrot-sound')==='0') SND.on=false; }catch(e){}

// shrink --f until content fits its container
function fitBox(content, box){
  var f=1; content.style.setProperty('--f',1);
  var need=function(){ return box===content ? content.scrollHeight>content.clientHeight+1 : content.offsetHeight>box.clientHeight*.9; };
  while(need() && f>.5){ f-=.05; content.style.setProperty('--f',f.toFixed(2)); }
}

function playSnd(step, n){
  if(!SND.on) return;
  var sd=VM.cur.snd;
  if(sd==='index'){ if(step===n-1) SND.chord(); else SND.tick(step/(n-1)); }
  else if(sd==='verdict'){ if(step===1) SND.chord(); else SND.pop(); }
  else if(sd==='line') SND.line(step);
  else if(sd==='pop') SND.pop();
  else if(sd==='scatter'){ if(step===n-1) SND.line(3); else if(step>0) SND.tick(step/n*.7); }
  else SND.tick(step/Math.max(1,n-1));
}
function revealStep(st){
  $$('[data-s="'+st+'"]',stage).forEach(function(el){ el.style.setProperty('--d','0s'); el.classList.add('on'); });
}
function revealAllNow(){ $$('.rv',stage).forEach(function(el){ el.style.setProperty('--d','0s'); el.classList.add('on'); }); VM.step=VM.cur.n; }
function stepDelay(st){
  var c=VM.cur;
  if(c.snd==='index' && st===c.n-1) return 1100;
  return c.ms;
}
function go(i, opts){
  clearTimeout(VM.timer);
  VM.i=Math.max(0,Math.min(VM.slides.length-1,i));
  VM.step=0;
  VM.cur=buildSlide(VM.slides[VM.i]);
  updateBar();
  if(VM.playing){ if(!(opts&&opts.silent)) SND.page(); VM.timer=setTimeout(tick, 700); }
  else revealAllNow();
}
function tick(){
  if(!VM.playing) return;
  var c=VM.cur;
  if(VM.step<c.n){
    revealStep(VM.step); playSnd(VM.step,c.n); VM.step++;
    VM.timer=setTimeout(tick, VM.step<c.n ? stepDelay(VM.step) : c.hold);
  } else if(VM.i<VM.slides.length-1){ go(VM.i+1); }
  else { VM.playing=false; updateBar(); }
}
function setPlaying(p){
  VM.playing=p; clearTimeout(VM.timer);
  if(p){ SND.init(); if(VM.step>=VM.cur.n && VM.i===VM.slides.length-1){ go(0); return; } VM.timer=setTimeout(tick, 250); }
  updateBar();
}
function updateBar(){
  $('#vPlayIc').innerHTML=VM.playing?IC.pause:IC.play;
  $('#vSndIc').innerHTML=SND.on?IC.sndOn:IC.sndOff;
  $('#vAr').textContent=VM.ar;
  $('#vCnt').textContent=(VM.i+1)+' / '+VM.slides.length;
  $('#vprog').style.width=((VM.i+1)/VM.slides.length*100)+'%';
}
function setBarHidden(h){ VM.barHidden=h; vbar.classList.toggle('hid',h); }
function openVM(push){
  VM.open=true; hideTip();
  vm.classList.add('open'); vm.setAttribute('aria-hidden','false'); document.body.classList.add('vm-open');
  SND.init();
  VM.slides=slideList(); fitStage(); VM.playing=true; setBarHidden(false); go(0);
  if(push!==false){ try{ history.pushState({vm:1},'',location.pathname+location.search+'#video'); }catch(e){} }
}
function closeVM(fromPop){
  if(!VM.open) return;
  VM.open=false; clearTimeout(VM.timer);
  vm.classList.remove('open'); vm.setAttribute('aria-hidden','true'); document.body.classList.remove('vm-open');
  stage.innerHTML='';
  if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function(){});
  if(!fromPop && location.hash==='#video'){ try{ history.back(); }catch(e){} }
}

document.addEventListener('keydown', function(e){
  if(!VM.open) return;
  var k=e.key;
  if(k==='Escape'){ closeVM(); }
  else if(k===' '||k==='k'||k==='K'){ e.preventDefault(); setPlaying(!VM.playing); }
  else if(k==='ArrowRight'){ go(VM.i+1); }
  else if(k==='ArrowLeft'){ go(VM.i-1); }
  else if(k==='h'||k==='H'){ setBarHidden(!VM.barHidden); }
  else if(k==='m'||k==='M'){ $('#vSnd').click(); }
  else if(k==='a'||k==='A'){ $('#vAr').click(); }
  else if(k==='f'||k==='F'){ if(fsOK) $('#vFs').click(); }
});

/* ============ boot ============ */
rebuildPage();
(function(){
  var q=location.search;
  var m=/[?&]ar=(16:9|9:16|1:1|16x9|9x16|1x1)/.exec(q);
  if(m){ VM.ar=m[1].replace('x',':'); }
  if(/[?&]video=1/.test(q) || location.hash==='#video'){ if(location.hash==='#video'){ try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} } openVM(); }
})();
})();
</script>
